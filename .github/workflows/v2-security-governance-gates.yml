name: V2 Security Governance Gates

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  governance-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Validate full API unit regression suite
        working-directory: services/api
        run: npm test

      - name: Install Workbench UI dependencies
        working-directory: apps/workbench-ui
        run: npm ci

      - name: Validate Workbench UI unit tests
        working-directory: apps/workbench-ui
        run: npm test

      - name: Build Workbench UI
        working-directory: apps/workbench-ui
        run: npm run build

      - name: Validate primitive Effect V1
        run: node scripts/validate_effect_primitive_v1.mjs

      - name: Validate Owner Admin Console governance
        run: |
          node --test services/api/test/ownerAdminConsoleGovernance.test.mjs
          node --test apps/workbench-ui/tests/ownerAdminParity.test.mjs

      - name: Validate security controls
        run: node scripts/validate_security_controls.mjs

      - name: Validate tenant scope
        run: node scripts/validate_tenant_scope.mjs

      - name: Validate process governance
        run: node scripts/validate_process_governance.mjs
