name: Primitive Effect Repair Validation

on:
  push:
    branches:
      - repair/primitive-effects-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-effect-repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diff whitespace check
        run: git diff --check 10b99b8376fe9b73fe8ae290a303b9695490a8db...HEAD

      - name: Syntax check Process Engine
        run: node --check services/api/src/core/core_process_engine.js

      - name: Audit graph Effect references in repository
        run: |
          echo "=== graph-like Effect references ==="
          git grep -nE '"type"[[:space:]]*:[[:space:]]*"(CHILD_SERVICE_OBJECT_CREATE|STATUS_SET|SO_UPDATE|TASK_UPDATE|INFO_RECORD_WRITE|INSTANCE_START|ACCESS_GRANT_UPDATE|HTTP_REQUEST|API_CALL|INVENTORY_MOVE|INVENTORY_CONSUME|INVENTORY_PRODUCE|INVENTORY_CONVERT|VARIANT_INVENTORY_VALIDATE|JSON_MERGE|ATTRS_MERGE)"' -- db services apps docs || true

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Run Effect primitive tests explicitly
        working-directory: services/api
        run: node --test test/effectPrimitiveV1.test.mjs

      - name: Run reasoning primitive tests explicitly
        working-directory: services/api
        run: node --test test/governedReasoningV1.test.mjs

      - name: Run Process Macro calc integration
        working-directory: services/api
        run: node --test test/processEngineCalcIntegration.integration.mjs

      - name: Run established temporal/resource tests explicitly
        working-directory: services/api
        run: node --test test/temporalResourceV1.test.mjs

      - name: Run API test suite
        id: full_api_tests
        continue-on-error: true
        working-directory: services/api
        run: npm test

      - name: Preserve full-suite failure status
        if: steps.full_api_tests.outcome != 'success'
        run: |
          echo "Full API suite has a failure. Focused Effect/Process/reasoning/temporal validation completed above."
          exit 1
